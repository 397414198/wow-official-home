<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoneWalkerLee · 私人魔兽服务器</title>
  <meta name="description" content="LoneWalkerLee 私人魔兽世界服务器 - 认识的朋友一起玩的小服" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="container">
    <header class="header">
      <div class="logo">LoneWalkerLee</div>
      <div class="tag">私人小服 · 仅限朋友</div>
    </header>

    <main class="main">
      <h1 class="title">艾泽拉斯见</h1>
      <p class="desc">
        这不是公开运营的服务器，只是自己在家闲着没事折腾出来的小玩具。<br />
        服务器跑在 NAS 上，基于 AzerothCore，认识的朋友想一起玩就来。
      </p>

      <div class="actions">
        <a href="https://wow.lonewalkerlee.dpdns.org/" class="btn primary" target="_blank" rel="noopener">
          注册账号
        </a>
        <button class="btn secondary" id="qqBtn">
          下载客户端
        </button>
      </div>

      <div class="qq-box" id="qqBox" hidden>
        <p>游戏客户端请联系 QQ 获取：</p>
        <div class="qq-number">397414198</div>
        <p class="tip">加好友时请备注来意</p>
      </div>

      <div class="note">
        <p>完整流程：先找我拿客户端 → 注册账号 → 登录游戏</p>
        <p>想玩就玩，想折腾就折腾。今晚有没有人喊你「上线，艾泽拉斯见」才是最重要的。</p>
      </div>
    </main>

    <footer class="footer">
      <p>LoneWalkerLee · 基于 Docker · AzerothCore · 私人架设</p>
      <p class="copy">For Azeroth.</p>
    </footer>
  </div>

  <script>
    const qqBtn = document.getElementById('qqBtn');
    const qqBox = document.getElementById('qqBox');

    qqBtn.addEventListener('click', () => {
      qqBox.hidden = !qqBox.hidden;
      if (!qqBox.hidden) {
        navigator.clipboard.writeText('397414198').catch(() => {});
      }
    });
  </script>
</body>
</html>
